<body>
    <div id="site-header" data-slogan="АРХІВ СТАТЕЙ" data-active="archive"></div>

    <!-- Page header -->
    <section class="page-header">
        <div class="container">
            <div class="page-title-container">
                <h1 class="page-title">АРХІВ СТАТЕЙ</h1>
                <p class="page-subtitle">Усі публікації Української Соціалістичної Ліги</p>
            </div>
        </div>
    </section>

    <!-- Main content -->
    <main id="main-content" class="archive-section">
        <div class="archive-controls">
            <input type="text" id="archive-search" class="archive-search" placeholder="Пошук у архіві...">
            <div id="archive-filters" class="archive-filters"></div>
        </div>
        <div id="archive-grid" class="news-grid archive-grid"></div>
        <p id="archive-empty" class="archive-empty" style="display:none;">Нічого не знайдено.</p>
    </main>

    <div id="site-footer"></div>

    <script src="js/layout.js"></script>
    <script src="js/archive-data.js"></script>
    <script>
        // ============================================
        // Динамічний архів статей
        // ============================================
        (function() {
            var articles = (typeof USL_ARCHIVE !== 'undefined') ? USL_ARCHIVE.slice() : [];
            var grid = document.getElementById('archive-grid');
            var filters = document.getElementById('archive-filters');
            var searchInput = document.getElementById('archive-search');
            var emptyMsg = document.getElementById('archive-empty');
            var activeTag = 'Всі';

            var tags = [];
            articles.forEach(function(a) {
                if (a.tag && tags.indexOf(a.tag) === -1) tags.push(a.tag);
            });

            var filterLabels = ['Всі'].concat(tags);
            filterLabels.forEach(function(tag) {
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'archive-filter-btn' + (tag === activeTag ? ' active' : '');
                btn.textContent = tag;
                btn.dataset.tag = tag;
                btn.addEventListener('click', function() {
                    activeTag = tag;
                    document.querySelectorAll('.archive-filter-btn').forEach(function(b) {
                        b.classList.toggle('active', b === btn);
                    });
                    render();
                });
                filters.appendChild(btn);
            });

            function matches(article) {
                if (activeTag !== 'Всі' && article.tag !== activeTag) return false;
                var q = searchInput.value.trim().toLowerCase();
                if (!q) return true;
                var haystack = (article.title + ' ' + (article.description || '') + ' ' + (article.tag || '') + ' ' + (article.date || '')).toLowerCase();
                return haystack.indexOf(q) !== -1;
            }

            function render() {
                grid.innerHTML = '';
                var visible = articles.filter(matches);
                visible.forEach(function(a) {
                    var card = document.createElement('article');
                    card.className = 'news-card';

                    var link = document.createElement('a');
                    link.href = a.url;
                    link.className = 'news-link';

                    var imageDiv = document.createElement('div');
                    imageDiv.className = 'news-image';
                    var pic = document.createElement('picture');
                    var src = document.createElement('source');
                    src.type = 'image/webp';
                    src.srcset = a.image.replace(/\.(png|jpe?g)$/i, '.webp');
                    pic.appendChild(src);
                    var img = document.createElement('img');
                    img.src = a.image;
                    img.alt = a.title;
                    img.loading = 'lazy';
                    pic.appendChild(img);
                    imageDiv.appendChild(pic);

                    var overlay = document.createElement('div');
                    overlay.className = 'news-overlay';
                    var badge = document.createElement('span');
                    badge.className = 'news-badge';
                    badge.textContent = a.tag || 'Стаття';
                    overlay.appendChild(badge);
                    imageDiv.appendChild(overlay);

                    var content = document.createElement('div');
                    content.className = 'news-content';
                    var h3 = document.createElement('h3');
                    h3.textContent = a.title;
                    var p = document.createElement('p');
                    p.textContent = a.description || '';
                    var date = document.createElement('span');
                    date.className = 'news-date';
                    date.textContent = a.date || '';
                    content.appendChild(h3);
                    content.appendChild(p);
                    content.appendChild(date);

                    link.appendChild(imageDiv);
                    link.appendChild(content);
                    card.appendChild(link);
                    grid.appendChild(card);
                });

                emptyMsg.style.display = visible.length ? 'none' : 'block';
            }

            searchInput.addEventListener('input', render);
            render();
        })();
    </script>
